[package]
name = "camera_test"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "camera_test"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
base64 = "0.22"
esp-idf-svc = "0.53"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "^2.0" }
bindings_header = "bindings.h"
bindings_module = "camera"
