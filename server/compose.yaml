# Local database for development. Start: docker compose up -d --wait   Stop: docker compose down
name: memory-glasses

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:5433:5432"  # 5433 so it doesn't clash with other projects' Postgres on 5432
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memory", "-d", "memory"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  db:
