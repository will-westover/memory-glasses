[project]
name = "memory-glasses-server"
version = "0.1.0"
description = "Ingest, search and question-answering for Memory Glasses"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "fastapi>=0.163.1",
    "numpy>=2.5.5",
    "openai>=3.49.0",
    "opencv-python-headless>=5.0.0.93",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E7", "E9", "B"]
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"memory/db/__init__.py" = ["F403"]
